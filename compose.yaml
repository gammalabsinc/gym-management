# Local work only. Run with: docker compose up --build
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
      POSTGRES_DB: gym
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      MODE: api
      PORT: "3000"
      LOG_LEVEL: debug
      DATABASE_URL: postgres://gym:gym@postgres:5432/gym
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
